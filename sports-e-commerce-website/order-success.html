<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Confirmed | Velocity Sports</title>
  
  <!-- Tailwind CSS CDN & Custom Styles -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="./css/style.css" />
  
  <!-- Supabase JS CDN Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- Header (Sleek Interface Theme) -->
  <header class="sleek-navbar sticky top-0 z-40 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      <a href="index.html" class="flex items-center gap-2.5 group">
        <div class="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center font-extrabold text-lg shadow-sm group-hover:bg-blue-500 transition">
          ⚡
        </div>
        <div>
          <span class="text-lg font-extrabold text-white tracking-wider block">VELOCITY<span class="text-blue-500">.</span></span>
        </div>
      </a>

      <nav class="flex items-center gap-6">
        <a href="index.html" class="text-xs uppercase font-bold text-slate-300 hover:text-white tracking-wider transition">
          Return to Store
        </a>
      </nav>
    </div>
  </header>

  <main class="flex-1 py-12">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
      
      <!-- Order Success Main Card -->
      <div id="order-success-card" class="bg-white rounded-3xl border border-slate-200 p-8 sm:p-10 shadow-sm text-center">
        
        <!-- Skeleton Loading -->
        <div class="animate-pulse py-8">
          <div class="w-16 h-16 bg-slate-200 rounded-full mx-auto mb-4"></div>
          <div class="h-6 bg-slate-200 rounded w-1/2 mx-auto mb-2"></div>
          <div class="h-4 bg-slate-200 rounded w-1/3 mx-auto"></div>
        </div>

      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-slate-900 text-slate-400 py-10 border-t border-slate-800 mt-auto text-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between gap-6">
      <div class="flex items-center gap-2">
        <span class="text-lg font-extrabold text-white">APEX<span class="text-sky-500">SPORTS</span></span>
        <span>— High Performance Athletic Gear</span>
      </div>
      <p class="text-xs text-slate-500">
        Powered by Vanilla JS, HTML5, CSS3 & Supabase Database.
      </p>
    </div>
  </footer>

  <!-- JavaScript Modules -->
  <script src="./js/supabase-config.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/order-success.js"></script>
</body>
</html>
