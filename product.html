<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details | ApexSports</title>
  
  <!-- Tailwind CSS CDN & Custom Styles -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="./css/style.css" />
  
  <!-- Supabase JS CDN Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- Top Status Banner -->
  <div id="supabase-status-banner" class="supabase-banner px-4 py-2 text-xs font-medium flex items-center justify-between">
    <div class="max-w-7xl mx-auto w-full flex items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="banner-text">Supabase Ready: Live stock checks and product details sync with database.</span>
      </div>
      <button id="open-supabase-modal-btn" class="underline hover:text-sky-100 font-semibold cursor-pointer">
        ⚙️ Configure Supabase Credentials
      </button>
    </div>
  </div>

  <!-- Header (Sleek Interface Theme) -->
  <header class="sleek-navbar sticky top-0 z-40 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      <a href="index.html" class="flex items-center gap-2.5 group">
        <div class="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center font-extrabold text-lg shadow-sm group-hover:bg-blue-500 transition">
          ⚡
        </div>
        <div>
          <span class="text-lg font-extrabold text-white tracking-wider block">VELOCITY<span class="text-blue-500">.</span></span>
        </div>
      </a>

      <nav class="flex items-center gap-6">
        <a href="index.html" class="text-xs uppercase font-bold text-slate-300 hover:text-white tracking-wider transition">
          ← Catalog
        </a>
        <a href="cart.html" class="relative inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white text-xs uppercase font-extrabold tracking-wider px-3.5 py-2 rounded-lg transition shadow-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
          </svg>
          <span>Cart</span>
          <span class="cart-count-badge hidden bg-white text-blue-700 text-xs font-black px-2 py-0.5 rounded-full">0</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="flex-1 py-10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      
      <!-- Breadcrumb Navigation -->
      <nav class="flex items-center gap-2 text-xs font-semibold text-slate-400 mb-6">
        <a href="index.html" class="hover:text-slate-700 transition">Home</a>
        <span>/</span>
        <span id="breadcrumb-category" class="hover:text-slate-700 transition">Sports Equipment</span>
        <span>/</span>
        <span id="breadcrumb-product-name" class="text-slate-800 font-bold truncate">Product Details</span>
      </nav>

      <!-- Main Product Display Card -->
      <div id="product-container" class="bg-white rounded-3xl border border-slate-200 p-6 md:p-10 shadow-xs mb-12">
        <!-- Skeleton Loading -->
        <div class="animate-pulse grid grid-cols-1 md:grid-cols-2 gap-10">
          <div class="bg-slate-200 h-96 rounded-2xl"></div>
          <div class="space-y-4">
            <div class="h-6 bg-slate-200 rounded w-1/4"></div>
            <div class="h-8 bg-slate-200 rounded w-3/4"></div>
            <div class="h-6 bg-slate-200 rounded w-1/3"></div>
            <div class="h-24 bg-slate-200 rounded"></div>
            <div class="h-12 bg-slate-200 rounded w-1/2"></div>
          </div>
        </div>
      </div>

      <!-- Related Products Section -->
      <div id="related-products-section" class="hidden">
        <h2 class="text-xl font-extrabold text-slate-900 mb-6">You Might Also Like</h2>
        <div id="related-products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
          <!-- Dynamic related products inserted by JS -->
        </div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-slate-900 text-slate-400 py-10 border-t border-slate-800 mt-auto text-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between gap-6">
      <div class="flex items-center gap-2">
        <span class="text-lg font-extrabold text-white">APEX<span class="text-sky-500">SPORTS</span></span>
        <span>— High Performance Athletic Gear</span>
      </div>
      <p class="text-xs text-slate-500">
        Powered by Vanilla JS, HTML5, CSS3 & Supabase Database.
      </p>
    </div>
  </footer>

  <!-- Supabase Credentials Setup Modal -->
  <div id="supabase-modal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 border border-slate-100">
      <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
        <h3 class="text-lg font-bold text-slate-900 flex items-center gap-2">
          <span>⚙️</span> Supabase Integration
        </h3>
        <button id="close-supabase-modal-btn" class="text-slate-400 hover:text-slate-700 text-xl font-bold cursor-pointer">&times;</button>
      </div>

      <div class="space-y-4 mb-6">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Supabase Project URL</label>
          <input
            type="text"
            id="supabase-url-input"
            placeholder="https://xyzcompany.supabase.co"
            class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-mono text-slate-800 focus:ring-2 focus:ring-sky-500 focus:outline-none"
          />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Supabase Anon Public Key</label>
          <input
            type="password"
            id="supabase-key-input"
            placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
            class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-mono text-slate-800 focus:ring-2 focus:ring-sky-500 focus:outline-none"
          />
        </div>
      </div>

      <div class="flex items-center justify-between gap-3">
        <div id="supabase-connection-status"></div>
        <button
          id="save-supabase-config-btn"
          class="bg-sky-600 hover:bg-sky-700 text-white font-bold text-xs px-5 py-2.5 rounded-xl transition shadow-xs cursor-pointer"
        >
          Save & Connect
        </button>
      </div>
    </div>
  </div>

  <!-- JavaScript Modules -->
  <script src="./js/supabase-config.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/product.js"></script>
</body>
</html>
